<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MoneyMagick — A Fake Guru App</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#150C28">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night-deep:#120B22;
    --night-panel:#221639;
    --night-panel-2:#2A1C48;
    --parchment:#33245A;
    --tile-text:#F0E9FA;
    --ink:#2A1B3D;
    --gold:#D4AF37;
    --violet-glow:#8F6FFF;
    --muted:#B6A8D6;
    --rust:#B5654F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    position:relative;
    background-color:var(--night-deep);
    background-attachment:fixed;
    color:var(--muted);
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }
  body::before{
    content:'';position:fixed;top:-90px;right:-70px;width:280px;height:280px;border-radius:50%;
    background:radial-gradient(circle, rgba(143,111,255,.35), transparent 70%);
    filter:blur(6px);pointer-events:none;z-index:0;
  }
  header.board-header,#rows,.subline,.add-row,.guru-strip{position:relative;z-index:1;}
  header.board-header{
    display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;row-gap:8px;
    padding:18px 16px 12px;
  }
  h1{font-family:'Cinzel',serif;font-weight:700;font-size:28px;margin:0;letter-spacing:.02em;color:#F5EFE0;}
  .eyebrow{display:block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-top:3px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.08);}
  .tagline{display:block;font-size:10.5px;font-style:italic;color:var(--muted);margin-top:8px;letter-spacing:.01em;}
  .status{display:flex;align-items:center;gap:7px;}
  .status-clickable{display:flex;align-items:center;gap:6px;cursor:pointer;padding:2px 3px;border-radius:6px;}
  .status-clickable:active{background:rgba(255,255,255,.06);}
  .diag-row{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:12.5px;line-height:1.4;}
  .diag-row:last-child{border-bottom:none;}
  .diag-ok{color:#9FE0A8;}
  .diag-fail{color:var(--rust);}
  .diag-meta{font-size:11px;color:var(--muted);margin-top:8px;}
  .diag-credit{font-size:10px;color:var(--muted);margin-top:10px;opacity:.7;}
  .diag-credit a{color:var(--muted);}
  .status-text{font-size:10px;letter-spacing:.04em;color:var(--muted);white-space:nowrap;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0;}
  .dot.offline{background:var(--rust);}
  #refreshBtn{
    background:none;border:1px solid rgba(255,255,255,.16);color:var(--muted);
    border-radius:8px;width:28px;height:28px;font-size:14px;cursor:pointer;line-height:1;
  }
  #refreshBtn:active{background:rgba(255,255,255,.08);}
  .subline{padding:7px 16px 0;font-size:11px;color:var(--muted);letter-spacing:.01em;}
  #rows{padding:12px 16px 4px;display:flex;flex-direction:column;gap:8px;}
  .row{
    background:var(--night-panel);border-radius:12px;padding:9px 8px;
    display:flex;gap:7px;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.35);
    transition:box-shadow .2s;min-width:0;
  }
  .row.active{box-shadow:0 2px 8px rgba(0,0,0,.35),0 0 0 1.5px var(--gold);}
  .reorder{display:flex;flex-direction:column;gap:0;flex-shrink:0;}
  .reorder button{background:none;border:none;color:var(--muted);font-size:9px;cursor:pointer;padding:2px 4px;line-height:1;}
  .reorder button:disabled{opacity:.2;cursor:default;}
  .flag-plate{
    width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.06);
    display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;
  }
  .code-wrap{display:flex;flex-direction:column;justify-content:center;width:76px;flex-shrink:0;overflow:hidden;}
  .code-main{font-family:'Cinzel',serif;font-weight:700;font-size:18px;color:#F0E9FA;letter-spacing:.02em;line-height:1.2;}
  .code-name{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;margin-top:1px;}
  .value-input{
    flex:1;min-width:0;font-family:'Space Mono',monospace;font-size:17px;font-weight:600;
    letter-spacing:.01em;font-variant-numeric:tabular-nums;background:var(--parchment);color:var(--tile-text);
    border:none;border-radius:8px;padding:7px 9px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
    text-align:right;cursor:pointer;caret-color:transparent;
  }
  .value-input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .remove{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:3px 3px;flex-shrink:0;}
  .remove:active{color:var(--rust);}
  .add-row{
    display:block;box-sizing:border-box;-webkit-appearance:none;appearance:none;
    margin:8px 16px 16px;padding:12px;border-radius:12px;border:1px dashed rgba(212,175,55,.35);
    background:none;color:var(--muted);font-family:'Inter';font-size:14px;letter-spacing:.02em;
    cursor:pointer;width:calc(100% - 32px);
  }
  .add-row:active{border-color:var(--gold);color:var(--gold);}
  .guru-strip{
    margin:4px 16px 22px;padding:12px 14px;border-radius:12px;background:rgba(143,111,255,.08);
    border:1px solid rgba(212,175,55,.3);display:flex;gap:10px;align-items:flex-start;cursor:pointer;
  }
  .guru-strip .icon{font-size:16px;flex-shrink:0;line-height:1.3;}
  .guru-strip .quote{font-size:12px;font-style:italic;color:var(--gold);line-height:1.45;}
  .guru-strip .quote .sig{display:block;font-style:normal;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px;}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:10;}
  .modal.hidden{display:none;}
  .modal-card{
    background:var(--night-panel-2);width:100%;max-width:420px;border-radius:16px 16px 0 0;
    padding:16px;max-height:82vh;display:flex;flex-direction:column;gap:10px;border-top:1px solid rgba(212,175,55,.3);
  }
  .modal-title{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.06em;color:var(--gold);font-weight:600;}
  #searchInput{padding:11px 12px;border-radius:8px;border:none;background:var(--parchment);color:var(--tile-text);font-size:15px;font-family:'Inter';}
  #searchResults{overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
  .result-item{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:8px;cursor:pointer;}
  .result-item:active{background:rgba(255,255,255,.08);}
  .result-flag{font-size:20px;width:26px;text-align:center;flex-shrink:0;}
  .result-code{font-family:'Cinzel',serif;font-weight:600;font-size:13px;width:44px;flex-shrink:0;color:#E7DEF6;}
  .result-name{font-size:13px;color:var(--muted);}
  .no-results{font-size:13px;color:var(--muted);padding:10px 8px;}
  #closeModal{align-self:flex-end;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:8px;}
  .calc-header{display:flex;align-items:center;gap:8px;}
  .calc-flag{font-size:19px;}
  .calc-code{font-family:'Cinzel',serif;font-weight:600;color:#E7DEF6;font-size:14px;letter-spacing:.04em;}
  .calc-display{background:var(--parchment);border-radius:10px;padding:12px 12px;}
  .calc-expr{font-family:'Space Mono',monospace;font-size:26px;font-weight:700;color:var(--tile-text);text-align:right;word-break:break-all;}
  .calc-preview{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);text-align:right;margin-top:3px;min-height:15px;}
  .calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .calc-btn{padding:13px 0;border-radius:10px;background:rgba(255,255,255,.06);color:#EDE7F5;font-family:'Space Mono',monospace;font-size:17px;border:none;cursor:pointer;}
  .calc-btn.op{background:rgba(212,175,55,.16);color:var(--gold);}
  .calc-btn.eq{background:var(--gold);color:var(--ink);font-weight:700;}
  .calc-btn.util{background:rgba(255,255,255,.04);color:var(--muted);font-size:14px;}
  .calc-btn:active{opacity:.7;}
  .calc-done{display:block;box-sizing:border-box;-webkit-appearance:none;appearance:none;padding:12px;border-radius:10px;border:1px solid rgba(212,175,55,.3);background:none;color:var(--gold);font-family:'Inter';font-size:14px;cursor:pointer;width:100%;}
  @media (max-width:380px){
    header.board-header{padding:14px 12px 10px;}
    h1{font-size:23px;}
    .tagline{font-size:9.5px;}
    .subline{padding:6px 12px 0;font-size:10px;}
    #rows{padding:10px 12px 4px;gap:6px;}
    .row{padding:8px 6px;gap:6px;}
    .flag-plate{width:28px;height:28px;font-size:15px;border-radius:7px;}
    .code-wrap{width:58px;}
    .code-main{font-size:16px;}
    .code-name{font-size:10.5px;}
    .value-input{font-size:15px;padding:7px 7px;}
    .remove{font-size:11px;}
    .add-row{margin:6px 12px 14px;padding:11px;font-size:13px;}
    .guru-strip{margin:4px 12px 18px;padding:10px 11px;}
  }
</style>
</head>
<body>
  <header class="board-header">
    <div>
      <h1>MoneyMagick</h1>
      <span class="eyebrow">A Fake Guru App</span>
      <span class="tagline">Ancient prophecies. Modern arbitrage.</span>
    </div>
    <div class="status">
      <span class="status-clickable" id="statusGroup" title="Tap to see the last fetch attempt">
        <span id="statusDot" class="dot"></span>
        <span id="statusText" class="status-text">loading</span>
      </span>
      <button id="refreshBtn" title="Refresh rates">⟳</button>
    </div>
  </header>
  <div class="subline" id="subline">&nbsp;</div>
  <div id="rows"></div>
  <button class="add-row" id="addBtn">+ Summon another currency</button>

  <div class="guru-strip" id="guruStrip" title="Tap for another pearl of fake wisdom">
    <span class="icon">🔮</span>
    <span class="quote" id="guruQuote">Loading wisdom...<span class="sig">— The Guru</span></span>
  </div>

  <div class="modal hidden" id="addModal">
    <div class="modal-card">
      <span class="modal-title">Choose your currency destiny</span>
      <input id="searchInput" placeholder="Whisper a currency name..." autocomplete="off">
      <div id="searchResults"></div>
      <button id="closeModal">Close the grimoire</button>
    </div>
  </div>

  <div class="modal hidden" id="diagModal">
    <div class="modal-card">
      <span class="modal-title">The Guru's Ledger</span>
      <div id="diagBody"></div>
      <button id="diagClose" class="calc-done">Close</button>
    </div>
  </div>

  <div class="modal hidden" id="calcModal">
    <div class="modal-card">
      <div class="calc-header">
        <span class="calc-flag" id="calcFlag"></span>
        <span class="calc-code" id="calcCodeLabel"></span>
      </div>
      <div class="calc-display">
        <div class="calc-expr" id="calcExprDisplay">0</div>
        <div class="calc-preview" id="calcPreview">&nbsp;</div>
      </div>
      <div class="calc-grid">
        <button class="calc-btn util" data-k="C">C</button>
        <button class="calc-btn util" data-k="(">(</button>
        <button class="calc-btn util" data-k=")">)</button>
        <button class="calc-btn util" data-k="back">⌫</button>
        <button class="calc-btn" data-k="7">7</button>
        <button class="calc-btn" data-k="8">8</button>
        <button class="calc-btn" data-k="9">9</button>
        <button class="calc-btn op" data-k="÷">÷</button>
        <button class="calc-btn" data-k="4">4</button>
        <button class="calc-btn" data-k="5">5</button>
        <button class="calc-btn" data-k="6">6</button>
        <button class="calc-btn op" data-k="×">×</button>
        <button class="calc-btn" data-k="1">1</button>
        <button class="calc-btn" data-k="2">2</button>
        <button class="calc-btn" data-k="3">3</button>
        <button class="calc-btn op" data-k="−">−</button>
        <button class="calc-btn" data-k="0">0</button>
        <button class="calc-btn" data-k=".">.</button>
        <button class="calc-btn eq" data-k="=">=</button>
        <button class="calc-btn op" data-k="+">+</button>
      </div>
      <button class="calc-done" id="calcDone">Done</button>
    </div>
  </div>

<script>
(function(){
  const CURRENCY_META = {
    USD:{name:'US Dollar',flag:'🇺🇸'}, EUR:{name:'Euro',flag:'🇪🇺'}, JPY:{name:'Japanese Yen',flag:'🇯🇵'},
    GBP:{name:'British Pound',flag:'🇬🇧'}, AUD:{name:'Australian Dollar',flag:'🇦🇺'}, CAD:{name:'Canadian Dollar',flag:'🇨🇦'},
    CHF:{name:'Swiss Franc',flag:'🇨🇭'}, CNY:{name:'Chinese Yuan',flag:'🇨🇳'}, HKD:{name:'Hong Kong Dollar',flag:'🇭🇰'},
    SGD:{name:'Singapore Dollar',flag:'🇸🇬'}, NZD:{name:'New Zealand Dollar',flag:'🇳🇿'}, KRW:{name:'South Korean Won',flag:'🇰🇷'},
    INR:{name:'Indian Rupee',flag:'🇮🇳'}, THB:{name:'Thai Baht',flag:'🇹🇭'}, MYR:{name:'Malaysian Ringgit',flag:'🇲🇾'},
    IDR:{name:'Indonesian Rupiah',flag:'🇮🇩'}, PHP:{name:'Philippine Peso',flag:'🇵🇭'}, MXN:{name:'Mexican Peso',flag:'🇲🇽'},
    BRL:{name:'Brazilian Real',flag:'🇧🇷'}, ZAR:{name:'South African Rand',flag:'🇿🇦'}, TRY:{name:'Turkish Lira',flag:'🇹🇷'},
    SEK:{name:'Swedish Krona',flag:'🇸🇪'}, NOK:{name:'Norwegian Krone',flag:'🇳🇴'}, DKK:{name:'Danish Krone',flag:'🇩🇰'},
    PLN:{name:'Polish Zloty',flag:'🇵🇱'}, CZK:{name:'Czech Koruna',flag:'🇨🇿'}, HUF:{name:'Hungarian Forint',flag:'🇭🇺'},
    RON:{name:'Romanian Leu',flag:'🇷🇴'}, ISK:{name:'Icelandic Krona',flag:'🇮🇸'},
    ILS:{name:'Israeli Shekel',flag:'🇮🇱'}
  };
  const ZERO_DECIMALS = new Set(['JPY','KRW','IDR','HUF','ISK']);
  const STORE_KEY = 'moneymagick-state';

  const RATE_SOURCES = [
    {
      name: 'Frankfurter (ECB)',
      url: (codes) => 'https://api.frankfurter.dev/v1/latest?base=USD&symbols=' + codes.join(','),
      parse: async (resp) => {
        const data = await resp.json();
        if(!data || typeof data.rates !== 'object') throw new Error('unexpected response shape');
        return { rates: Object.assign({USD:1}, data.rates), date: data.date };
      }
    },
    {
      name: 'ExchangeRate-API (backup)',
      url: () => 'https://open.er-api.com/v6/latest/USD',
      parse: async (resp) => {
        const data = await resp.json();
        if(!data || data.result !== 'success' || typeof data.rates !== 'object') throw new Error('unexpected response shape');
        const date = data.time_last_update_utc ? new Date(data.time_last_update_utc).toISOString().slice(0,10) : null;
        return { rates: Object.assign({USD:1}, data.rates), date: date };
      }
    }
  ];

  const GURU_WISDOM = [
    "A dollar saved is a dollar the exchange rate will eventually humble.",
    "The rich stack pennies. The wise stack currencies.",
    "He who converts in haste, converts at a worse rate.",
    "Money talks. Yours currently speaks five languages.",
    "The market is a mirror. Mostly it reflects your poor timing.",
    "Ask not what your currency can do for you. Ask what the Guru's crystal ball says it's worth today.",
    "A wise trader checks the rate twice and complains about it once.",
    "Somewhere, a currency is up. Somewhere else, it is very much not.",
    "The Guru does not chase rates. The Guru refreshes and waits.",
    "One man's exchange fee is another man's yacht payment.",
    "True wealth is knowing what 2,396 of anything is worth in yen.",
    "The path to riches is paved with decimal points.",
    "Patience is a virtue. So is checking the rate one more time.",
    "The Guru has seen currencies rise and fall. Mostly fall on Mondays."
  ];

  function randomWisdom(){
    return GURU_WISDOM[Math.floor(Math.random() * GURU_WISDOM.length)];
  }

  let state = {
    currencies: ['USD','EUR','JPY','HKD','CNY'],
    activeCode: 'USD',
    activeValue: 1,
    rates: {USD:1},
    ratesTimestamp: null,
    ratesDate: null,
    rateSource: null,
    lastCheckLog: [],
    online: null
  };

  let calc = { code: null, expr: '', fresh: true };

  const rowsEl = document.getElementById('rows');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const subline = document.getElementById('subline');
  const addModal = document.getElementById('addModal');
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');
  const guruStrip = document.getElementById('guruStrip');
  const guruQuote = document.getElementById('guruQuote');
  const calcModal = document.getElementById('calcModal');
  const calcExprDisplay = document.getElementById('calcExprDisplay');
  const calcPreview = document.getElementById('calcPreview');
  const calcFlag = document.getElementById('calcFlag');
  const calcCodeLabel = document.getElementById('calcCodeLabel');
  const diagModal = document.getElementById('diagModal');
  const statusGroup = document.getElementById('statusGroup');

  function showNewWisdom(){
    guruQuote.innerHTML = randomWisdom() + '<span class="sig">— The Guru</span>';
  }
  guruStrip.addEventListener('click', showNewWisdom);

  function fmt(num, code){
    const d = ZERO_DECIMALS.has(code) ? 0 : 2;
    if(!isFinite(num)) num = 0;
    return num.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
  }

  function timeAgo(ts){
    if(!ts) return '—';
    const diff = Math.max(0, Date.now() - ts);
    const mins = Math.floor(diff/60000);
    if(mins < 1) return 'just now';
    if(mins < 60) return mins + ' min ago';
    const hrs = Math.floor(mins/60);
    if(hrs < 24) return hrs + ' hr ago';
    return new Date(ts).toLocaleDateString();
  }

  function shortDateTime(ts){
    if(!ts) return '—';
    const d = new Date(ts);
    const day = d.getDate();
    const month = d.toLocaleString(undefined, { month: 'short' });
    const time = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    return day + ' ' + month + ', ' + time;
  }

  function saveState(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify({
        currencies: state.currencies,
        rates: state.rates,
        ratesTimestamp: state.ratesTimestamp,
        ratesDate: state.ratesDate,
        rateSource: state.rateSource
      }));
    }catch(e){ /* best-effort persistence */ }
  }

  function loadState(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw){
        const saved = JSON.parse(raw);
        if(saved.currencies && saved.currencies.length) state.currencies = saved.currencies;
        // drop any currency no longer supported (e.g. retired after adopting the euro)
        state.currencies = state.currencies.filter(c => CURRENCY_META[c]);
        if(state.currencies.length === 0) state.currencies = ['USD'];
        if(saved.rates) state.rates = saved.rates;
        state.ratesTimestamp = saved.ratesTimestamp || null;
        state.ratesDate = saved.ratesDate || null;
        state.rateSource = saved.rateSource || null;
        state.activeCode = state.currencies[0];
      }
    }catch(e){ /* no saved state yet */ }
  }

  function validateRates(rates, codes){
    for(const c of codes){
      if(c === 'USD') continue;
      if(typeof rates[c] !== 'number' || !isFinite(rates[c])) return false;
    }
    return true;
  }

  async function fetchWithTimeout(url, ms){
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try{
      return await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
    } finally {
      clearTimeout(timer);
    }
  }

  async function fetchRates(){
    const others = Object.keys(CURRENCY_META).filter(c => c !== 'USD');
    const log = [];

    for(const src of RATE_SOURCES){
      let note = '';
      for(let attempt = 1; attempt <= 2; attempt++){
        try{
          const resp = await fetchWithTimeout(src.url(others), 7000);
          if(!resp.ok) throw new Error('HTTP ' + resp.status);
          const { rates, date } = await src.parse(resp);
          if(!validateRates(rates, others)) throw new Error('response missing a needed currency');

          state.rates = Object.assign({USD:1}, rates);
          state.ratesTimestamp = Date.now();
          state.ratesDate = date || new Date().toISOString().slice(0,10);
          state.online = true;
          state.rateSource = src.name;
          log.push({ source: src.name, ok: true, note: attempt === 1 ? 'ok' : 'ok on retry' });
          state.lastCheckLog = log;
          saveState();
          updateStatus();
          return;
        }catch(e){
          note = (e && e.name === 'AbortError') ? 'timed out (7s)' : ((e && e.message) || 'failed');
          if(attempt < 2) await new Promise(r => setTimeout(r, 900));
        }
      }
      log.push({ source: src.name, ok: false, note: note });
    }

    state.online = false;
    state.lastCheckLog = log;
    updateStatus();
  }

  function updateStatus(){
    if(state.online === false){
      statusDot.classList.add('offline');
      statusText.textContent = 'offline';
      subline.textContent = state.ratesTimestamp
        ? 'Offline — last updated ' + shortDateTime(state.ratesTimestamp)
        : 'Not synced yet — connect once to fetch rates';
      subline.style.display = '';
    } else if(state.online === true){
      statusDot.classList.remove('offline');
      statusText.textContent = 'live';
      subline.textContent = '';
      subline.style.display = 'none';
    } else {
      statusDot.classList.remove('offline');
      statusText.textContent = 'loading';
      subline.textContent = 'Consulting the Guru...';
      subline.style.display = '';
    }
  }

  function friendlyNote(note){
    const httpMatch = /^HTTP (\d+)$/.exec(note || '');
    if(httpMatch){
      const code = httpMatch[1];
      if(code === '404') return "couldn't be found — its address may have moved";
      if(code === '429') return 'is busy right now, try again later';
      if(code[0] === '5') return 'had a server problem';
      return "didn't accept the request";
    }
    if(note === 'unexpected response shape') return "sent back something the app didn't understand";
    if(note === 'response missing a needed currency') return "didn't have all the rates needed";
    if(note && note.indexOf('timed out') === 0) return 'took too long to respond';
    return "couldn't be reached";
  }

  function renderDiagnostics(){
    const hasFail = state.lastCheckLog && state.lastCheckLog.some(l => !l.ok);
    const rows = (state.lastCheckLog && state.lastCheckLog.length)
      ? state.lastCheckLog.map(l =>
          '<div class="diag-row ' + (l.ok ? 'diag-ok' : 'diag-fail') + '">' +
          (l.ok ? '✓ ' : '✕ ') + l.source + ' — ' + (l.ok ? l.note : friendlyNote(l.note)) +
          '</div>'
        ).join('')
      : '<div class="diag-row">No checks run yet.</div>';
    const explain = hasFail
      ? '<div class="diag-meta">A ✕ just means that source didn\'t answer, so the app moved on to the next one automatically — nothing you need to do.</div>'
      : '';
    const cacheCount = Object.keys(state.rates || {}).length;
    const meta = '<div class="diag-meta">Holding ' + cacheCount + ' cached rate(s) — rates as of ' +
      (state.ratesDate || '—') + ', last synced ' + shortDateTime(state.ratesTimestamp) + '.</div>';
    const credit = '<div class="diag-credit">Rates by Frankfurter (ECB) and <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">ExchangeRate-API</a>.</div>';
    document.getElementById('diagBody').innerHTML = rows + explain + meta + credit;
  }

  function computeValue(code){
    if(code === state.activeCode) return fmt(state.activeValue, code);
    const rFrom = state.rates[state.activeCode];
    const rTo = state.rates[code];
    if(!rFrom || !rTo) return '—';
    const val = state.activeValue * (rTo / rFrom);
    return fmt(val, code);
  }

  function renderRows(){
    rowsEl.innerHTML = state.currencies.map((code, idx) => {
      const meta = CURRENCY_META[code] || {name: code, flag: '🏳️'};
      const isActive = code === state.activeCode;
      const val = computeValue(code);
      return (
        '<div class="row' + (isActive ? ' active' : '') + '" data-code="' + code + '">' +
          '<div class="reorder">' +
            '<button class="up" ' + (idx===0?'disabled':'') + '>▲</button>' +
            '<button class="down" ' + (idx===state.currencies.length-1?'disabled':'') + '>▼</button>' +
          '</div>' +
          '<div class="flag-plate">' + meta.flag + '</div>' +
          '<div class="code-wrap"><span class="code-main">' + code + '</span><span class="code-name">' + meta.name + '</span></div>' +
          '<input class="value-input" readonly data-code="' + code + '" value="' + val + '">' +
          '<button class="remove" ' + (state.currencies.length<=1?'disabled':'') + '>✕</button>' +
        '</div>'
      );
    }).join('');
  }

  function moveCurrency(code, dir){
    const i = state.currencies.indexOf(code);
    const j = i + dir;
    if(j < 0 || j >= state.currencies.length) return;
    [state.currencies[i], state.currencies[j]] = [state.currencies[j], state.currencies[i]];
    saveState();
    renderRows();
  }

  function removeCurrency(code){
    if(state.currencies.length <= 1) return;
    state.currencies = state.currencies.filter(c => c !== code);
    if(state.activeCode === code){
      state.activeCode = state.currencies[0];
      state.activeValue = 1;
    }
    saveState();
    renderRows();
  }

  function addCurrency(code){
    if(state.currencies.includes(code)) return;
    state.currencies.push(code);
    renderRows();
    fetchRates().then(() => { renderRows(); });
  }

  function renderSearchResults(query){
    const q = query.trim().toLowerCase();
    const entries = Object.keys(CURRENCY_META)
      .filter(code => !state.currencies.includes(code))
      .filter(code => {
        if(!q) return true;
        const meta = CURRENCY_META[code];
        return code.toLowerCase().includes(q) || meta.name.toLowerCase().includes(q);
      });
    if(entries.length === 0){
      searchResults.innerHTML = '<div class="no-results">The Guru hath no such currency. Try again, mortal.</div>';
      return;
    }
    searchResults.innerHTML = entries.map(code => {
      const meta = CURRENCY_META[code];
      return (
        '<div class="result-item" data-code="' + code + '">' +
          '<span class="result-flag">' + meta.flag + '</span>' +
          '<span class="result-code">' + code + '</span>' +
          '<span class="result-name">' + meta.name + '</span>' +
        '</div>'
      );
    }).join('');
  }

  // ---- Calculator ----
  function safeEval(expr){
    if(!expr) return null;
    const sanitized = expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
    if(!/^[0-9+\-*/.() ]+$/.test(sanitized)) return null;
    try{
      const result = Function('"use strict";return (' + sanitized + ')')();
      if(typeof result !== 'number' || !isFinite(result)) return null;
      return result;
    }catch(e){ return null; }
  }

  function trimNum(n){
    return (Math.round(n*1e8)/1e8).toString();
  }

  function openCalculator(code){
    const meta = CURRENCY_META[code] || {name: code, flag: '🏳️'};
    calc.code = code;
    const rowInput = rowsEl.querySelector('.value-input[data-code="' + code + '"]');
    const shown = rowInput ? rowInput.value.replace(/,/g,'') : '';
    calc.expr = (shown && shown !== '—') ? shown : '';
    calc.fresh = true;
    calcFlag.textContent = meta.flag;
    calcCodeLabel.textContent = code;
    updateCalcDisplay();
    calcModal.classList.remove('hidden');
  }

  function updateCalcDisplay(){
    calcExprDisplay.textContent = calc.expr || '0';
    const val = safeEval(calc.expr);
    if(val !== null){
      const hasOperator = /[+\-×÷]/.test(calc.expr.slice(1));
      calcPreview.textContent = hasOperator ? ('= ' + fmt(val, calc.code)) : '\u00A0';
      state.activeCode = calc.code;
      state.activeValue = Math.round(val*1e8)/1e8;
      renderRows();
    } else {
      calcPreview.textContent = '\u00A0';
    }
  }

  function calcPress(key){
    if(key === 'C'){
      calc.expr = ''; calc.fresh = false;
    } else if(key === 'back'){
      calc.expr = calc.expr.slice(0, -1); calc.fresh = false;
    } else if(key === '='){
      const val = safeEval(calc.expr);
      if(val !== null){ calc.expr = trimNum(val); calc.fresh = true; }
    } else if(key === '+' || key === '−' || key === '×' || key === '÷'){
      if(calc.expr === '') return;
      if(/[+\-×÷]$/.test(calc.expr)) calc.expr = calc.expr.slice(0, -1);
      calc.expr += key; calc.fresh = false;
    } else if(key === '(' || key === ')'){
      calc.expr += key; calc.fresh = false;
    } else if(key === '.'){
      const seg = calc.expr.split(/[+\-×÷()]/).pop();
      if(seg.includes('.')) return;
      if(calc.fresh){ calc.expr = ''; calc.fresh = false; }
      calc.expr += (calc.expr === '' ? '0.' : '.');
    } else {
      if(calc.fresh){ calc.expr = ''; calc.fresh = false; }
      calc.expr += key;
    }
    updateCalcDisplay();
  }

  document.querySelectorAll('.calc-btn').forEach(btn => {
    btn.addEventListener('click', () => calcPress(btn.dataset.k));
  });
  document.getElementById('calcDone').addEventListener('click', () => calcModal.classList.add('hidden'));
  calcModal.addEventListener('click', e => { if(e.target === calcModal) calcModal.classList.add('hidden'); });

  // ---- Event delegation ----
  rowsEl.addEventListener('click', e => {
    const inp = e.target.closest('.value-input');
    if(inp){ openCalculator(inp.dataset.code); return; }
    const btn = e.target.closest('button');
    if(!btn) return;
    const row = e.target.closest('.row');
    const code = row && row.dataset.code;
    if(!code) return;
    if(btn.classList.contains('up')) moveCurrency(code, -1);
    else if(btn.classList.contains('down')) moveCurrency(code, 1);
    else if(btn.classList.contains('remove')) removeCurrency(code);
  });

  document.getElementById('refreshBtn').addEventListener('click', () => {
    statusText.textContent = 'updating';
    fetchRates().then(() => renderRows());
  });

  statusGroup.addEventListener('click', () => {
    renderDiagnostics();
    diagModal.classList.remove('hidden');
  });
  document.getElementById('diagClose').addEventListener('click', () => diagModal.classList.add('hidden'));
  diagModal.addEventListener('click', e => { if(e.target === diagModal) diagModal.classList.add('hidden'); });

  document.getElementById('addBtn').addEventListener('click', () => {
    addModal.classList.remove('hidden');
    searchInput.value = '';
    renderSearchResults('');
    setTimeout(() => searchInput.focus(), 50);
  });
  document.getElementById('closeModal').addEventListener('click', () => addModal.classList.add('hidden'));
  addModal.addEventListener('click', e => { if(e.target === addModal) addModal.classList.add('hidden'); });
  searchInput.addEventListener('input', e => renderSearchResults(e.target.value));
  searchResults.addEventListener('click', e => {
    const item = e.target.closest('.result-item');
    if(!item) return;
    addCurrency(item.dataset.code);
    addModal.classList.add('hidden');
  });

  (async function init(){
    showNewWisdom();
    loadState();
    renderRows();
    updateStatus();
    await fetchRates();
    renderRows();

    window.addEventListener('offline', () => {
      state.online = false;
      updateStatus();
    });
    window.addEventListener('online', () => {
      state.online = null;
      updateStatus();
      fetchRates().then(() => renderRows());
    });
  })();
})();
</script>
</body>
</html>
