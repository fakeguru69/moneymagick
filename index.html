<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MoneyMagic — A Fake Guru App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board-black:#15171A;
    --board-charcoal:#2B2E33;
    --flap-cream:#EDE7D9;
    --flap-shadow:#C9C2B0;
    --amber:#E8A33D;
    --ink:#22201C;
    --rust:#B5533C;
    --cream-text:#EDE7D9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--board-black);
    color:var(--cream-text);
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  header.board-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:20px 16px 14px;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .eyebrow{
    display:block;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--amber);
    font-weight:600;
  }
  h1{
    font-family:'Space Mono',monospace;
    font-size:22px;
    margin:4px 0 0;
    letter-spacing:.01em;
  }
  .status{display:flex;align-items:center;gap:8px;}
  .status-text{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--flap-shadow);white-space:nowrap;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 2s infinite;flex-shrink:0;}
  .dot.offline{background:var(--rust);box-shadow:0 0 8px var(--rust);animation:none;}
  #refreshBtn{
    background:none;border:1px solid rgba(255,255,255,.18);color:var(--cream-text);
    border-radius:8px;width:30px;height:30px;font-size:15px;cursor:pointer;line-height:1;
  }
  #refreshBtn:active{background:rgba(255,255,255,.08);}
  .subline{padding:8px 16px 0;font-size:11px;color:var(--flap-shadow);letter-spacing:.02em;}
  .guru-strip{
    margin:10px 16px 0;padding:10px 12px;border-radius:10px;background:rgba(232,163,61,.08);
    border:1px solid rgba(232,163,61,.25);display:flex;gap:8px;align-items:flex-start;cursor:pointer;
  }
  .guru-strip .icon{font-size:15px;flex-shrink:0;line-height:1.3;}
  .guru-strip .quote{font-size:12px;font-style:italic;color:var(--amber);line-height:1.4;}
  .guru-strip .quote .sig{display:block;font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--flap-shadow);margin-top:3px;}
  #rows{padding:14px 16px 4px;display:flex;flex-direction:column;gap:12px;}
  .row{
    background:var(--board-charcoal);border-radius:14px;padding:10px 10px 10px 8px;
    display:flex;gap:8px;align-items:stretch;box-shadow:0 2px 6px rgba(0,0,0,.35);
    transition:box-shadow .2s;
  }
  .row.active{box-shadow:0 2px 6px rgba(0,0,0,.35),0 0 0 1.5px var(--amber);}
  .reorder{display:flex;flex-direction:column;justify-content:center;gap:1px;}
  .reorder button{
    background:none;border:none;color:var(--flap-shadow);font-size:10px;cursor:pointer;
    padding:4px 5px;line-height:1;
  }
  .reorder button:disabled{opacity:.2;cursor:default;}
  .flag-plate{
    width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,.06);
    display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;align-self:center;
  }
  .row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .row-top{display:flex;align-items:baseline;gap:7px;}
  .code{font-family:'Space Mono',monospace;font-weight:700;font-size:14px;letter-spacing:.03em;}
  .name{font-size:11px;color:var(--flap-shadow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
  .remove{background:none;border:none;color:var(--flap-shadow);font-size:13px;cursor:pointer;padding:3px 4px;}
  .remove:active{color:var(--rust);}
  .value-input{
    font-family:'Space Mono',monospace;font-size:26px;font-weight:700;letter-spacing:.02em;
    font-variant-numeric:tabular-nums;background:var(--flap-cream);color:var(--ink);
    border:none;border-radius:8px;padding:8px 10px;width:100%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
    background-image:linear-gradient(var(--flap-shadow),var(--flap-shadow));
    background-size:100% 1px;background-repeat:no-repeat;background-position:center;
  }
  .value-input:focus{outline:2px solid var(--amber);outline-offset:1px;}
  @keyframes flipPulse{0%{transform:scaleY(1);}40%{transform:scaleY(.88);}100%{transform:scaleY(1);}}
  .flip{animation:flipPulse .28s ease;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .add-row{
    margin:6px 16px 20px;padding:14px;border-radius:14px;border:1px dashed rgba(255,255,255,.25);
    background:none;color:var(--cream-text);font-family:'Inter';font-size:14px;letter-spacing:.02em;
    cursor:pointer;width:calc(100% - 32px);
  }
  .add-row:active{border-color:var(--amber);color:var(--amber);}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10;}
  .modal.hidden{display:none;}
  .modal-card{
    background:var(--board-charcoal);width:100%;max-width:480px;border-radius:16px 16px 0 0;
    padding:16px;max-height:72vh;display:flex;flex-direction:column;gap:10px;
  }
  .modal-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:600;}
  #searchInput{padding:11px 12px;border-radius:8px;border:none;background:var(--flap-cream);color:var(--ink);font-size:15px;font-family:'Inter';}
  #searchResults{overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
  .result-item{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:8px;cursor:pointer;}
  .result-item:active{background:rgba(255,255,255,.08);}
  .result-flag{font-size:20px;width:26px;text-align:center;flex-shrink:0;}
  .result-code{font-family:'Space Mono',monospace;font-weight:700;font-size:13px;width:44px;flex-shrink:0;}
  .result-name{font-size:13px;color:var(--flap-shadow);}
  .no-results{font-size:13px;color:var(--flap-shadow);padding:10px 8px;}
  #closeModal{align-self:flex-end;background:none;border:none;color:var(--flap-shadow);font-size:13px;cursor:pointer;padding:8px;}
  @media (prefers-reduced-motion: reduce){.dot{animation:none;}.flip{animation:none;}}
</style>
</head>
<body>
  <header class="board-header">
    <div>
      <span class="eyebrow">A Fake Guru App</span>
      <h1>MoneyMagic</h1>
    </div>
    <div class="status">
      <span id="statusDot" class="dot"></span>
      <span id="statusText" class="status-text">LOADING</span>
      <button id="refreshBtn" title="Refresh rates">⟳</button>
    </div>
  </header>
  <div class="subline" id="subline">&nbsp;</div>
  <div class="guru-strip" id="guruStrip" title="Tap for another pearl of fake wisdom">
    <span class="icon">🔮</span>
    <span class="quote" id="guruQuote">Loading wisdom...<span class="sig">— The Guru</span></span>
  </div>
  <div id="rows"></div>
  <button class="add-row" id="addBtn">+ Summon another currency</button>

  <div class="modal hidden" id="addModal">
    <div class="modal-card">
      <span class="modal-title">Choose your currency destiny</span>
      <input id="searchInput" placeholder="Whisper a currency name..." autocomplete="off">
      <div id="searchResults"></div>
      <button id="closeModal">Enough wisdom</button>
    </div>
  </div>

<script>
(function(){
  const CURRENCY_META = {
    USD:{name:'US Dollar',flag:'🇺🇸'}, EUR:{name:'Euro',flag:'🇪🇺'}, JPY:{name:'Japanese Yen',flag:'🇯🇵'},
    GBP:{name:'British Pound',flag:'🇬🇧'}, AUD:{name:'Australian Dollar',flag:'🇦🇺'}, CAD:{name:'Canadian Dollar',flag:'🇨🇦'},
    CHF:{name:'Swiss Franc',flag:'🇨🇭'}, CNY:{name:'Chinese Yuan',flag:'🇨🇳'}, HKD:{name:'Hong Kong Dollar',flag:'🇭🇰'},
    SGD:{name:'Singapore Dollar',flag:'🇸🇬'}, NZD:{name:'New Zealand Dollar',flag:'🇳🇿'}, KRW:{name:'South Korean Won',flag:'🇰🇷'},
    INR:{name:'Indian Rupee',flag:'🇮🇳'}, THB:{name:'Thai Baht',flag:'🇹🇭'}, MYR:{name:'Malaysian Ringgit',flag:'🇲🇾'},
    IDR:{name:'Indonesian Rupiah',flag:'🇮🇩'}, PHP:{name:'Philippine Peso',flag:'🇵🇭'}, MXN:{name:'Mexican Peso',flag:'🇲🇽'},
    BRL:{name:'Brazilian Real',flag:'🇧🇷'}, ZAR:{name:'South African Rand',flag:'🇿🇦'}, TRY:{name:'Turkish Lira',flag:'🇹🇷'},
    SEK:{name:'Swedish Krona',flag:'🇸🇪'}, NOK:{name:'Norwegian Krone',flag:'🇳🇴'}, DKK:{name:'Danish Krone',flag:'🇩🇰'},
    PLN:{name:'Polish Zloty',flag:'🇵🇱'}, CZK:{name:'Czech Koruna',flag:'🇨🇿'}, HUF:{name:'Hungarian Forint',flag:'🇭🇺'},
    RON:{name:'Romanian Leu',flag:'🇷🇴'}, BGN:{name:'Bulgarian Lev',flag:'🇧🇬'}, ISK:{name:'Icelandic Krona',flag:'🇮🇸'},
    ILS:{name:'Israeli Shekel',flag:'🇮🇱'}
  };
  const ZERO_DECIMALS = new Set(['JPY','KRW','IDR','HUF','ISK']);
  const FRANKFURTER = 'https://api.frankfurter.app';
  const STORE_KEY = 'moneymagic-state';

  const GURU_WISDOM = [
    "A dollar saved is a dollar the exchange rate will eventually humble.",
    "The rich stack pennies. The wise stack currencies.",
    "He who converts in haste, converts at a worse rate.",
    "Money talks. Yours currently speaks five languages.",
    "The market is a mirror. Mostly it reflects your poor timing.",
    "Ask not what your currency can do for you. Ask what the Guru's crystal ball says it's worth today.",
    "A wise trader checks the rate twice and complains about it once.",
    "Somewhere, a currency is up. Somewhere else, it is very much not.",
    "The Guru does not chase rates. The Guru refreshes and waits.",
    "One man's exchange fee is another man's yacht payment.",
    "True wealth is knowing what 2,396 of anything is worth in yen.",
    "The path to riches is paved with decimal points.",
    "Patience is a virtue. So is checking the rate one more time.",
    "The Guru has seen currencies rise and fall. Mostly fall on Mondays."
  ];

  function randomWisdom(){
    return GURU_WISDOM[Math.floor(Math.random() * GURU_WISDOM.length)];
  }

  let state = {
    currencies: ['USD','EUR','JPY','HKD','CNY'],
    activeCode: 'USD',
    rawValue: '1',
    rates: {USD:1},
    ratesTimestamp: null,
    ratesDate: null,
    online: null
  };

  const rowsEl = document.getElementById('rows');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const subline = document.getElementById('subline');
  const addModal = document.getElementById('addModal');
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');
  const guruStrip = document.getElementById('guruStrip');
  const guruQuote = document.getElementById('guruQuote');

  function showNewWisdom(){
    guruQuote.innerHTML = randomWisdom() + '<span class="sig">— The Guru</span>';
  }
  guruStrip.addEventListener('click', showNewWisdom);

  function fmt(num, code){
    const d = ZERO_DECIMALS.has(code) ? 0 : 2;
    if(!isFinite(num)) num = 0;
    return num.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
  }

  function timeAgo(ts){
    if(!ts) return '—';
    const diff = Math.max(0, Date.now() - ts);
    const mins = Math.floor(diff/60000);
    if(mins < 1) return 'just now';
    if(mins < 60) return mins + ' min ago';
    const hrs = Math.floor(mins/60);
    if(hrs < 24) return hrs + ' hr ago';
    return new Date(ts).toLocaleDateString();
  }

  async function saveState(){
    try{
      await window.storage.set(STORE_KEY, JSON.stringify({
        currencies: state.currencies,
        rates: state.rates,
        ratesTimestamp: state.ratesTimestamp,
        ratesDate: state.ratesDate
      }), false);
    }catch(e){ /* best-effort persistence */ }
  }

  async function loadState(){
    try{
      const res = await window.storage.get(STORE_KEY, false);
      if(res && res.value){
        const saved = JSON.parse(res.value);
        if(saved.currencies && saved.currencies.length) state.currencies = saved.currencies;
        if(saved.rates) state.rates = saved.rates;
        state.ratesTimestamp = saved.ratesTimestamp || null;
        state.ratesDate = saved.ratesDate || null;
        state.activeCode = state.currencies[0];
      }
    }catch(e){ /* no saved state yet */ }
  }

  async function fetchRates(codes){
    const others = codes.filter(c => c !== 'USD');
    try{
      if(others.length === 0){
        state.rates = {USD:1};
        state.ratesTimestamp = Date.now();
        state.ratesDate = new Date().toISOString().slice(0,10);
        state.online = true;
      } else {
        const url = FRANKFURTER + '/latest?from=USD&to=' + others.join(',');
        const resp = await fetch(url);
        if(!resp.ok) throw new Error('bad response');
        const data = await resp.json();
        state.rates = Object.assign({USD:1}, data.rates);
        state.ratesTimestamp = Date.now();
        state.ratesDate = data.date;
        state.online = true;
      }
      await saveState();
    }catch(e){
      state.online = false;
    }
    updateStatus();
  }

  function updateStatus(){
    if(state.online === false){
      statusDot.classList.add('offline');
      statusText.textContent = 'OFFLINE';
      subline.textContent = "The Guru's crystal ball is foggy — showing the last known rates from " + timeAgo(state.ratesTimestamp) + (state.ratesDate ? ' (' + state.ratesDate + ')' : '');
    } else if(state.online === true){
      statusDot.classList.remove('offline');
      statusText.textContent = 'LIVE';
      subline.textContent = 'Blessed by the Exchange Spirits (ECB reference rates) as of ' + (state.ratesDate || '—') + ' • updated ' + timeAgo(state.ratesTimestamp);
    } else {
      statusDot.classList.remove('offline');
      statusText.textContent = 'LOADING';
      subline.textContent = 'Consulting the Guru...';
    }
  }

  function computeValue(code){
    if(code === state.activeCode) return state.rawValue;
    const num = parseFloat(state.rawValue) || 0;
    const rFrom = state.rates[state.activeCode];
    const rTo = state.rates[code];
    let val = 0;
    if(rFrom && rTo) val = num * (rTo / rFrom);
    return fmt(val, code);
  }

  function renderRows(){
    rowsEl.innerHTML = state.currencies.map((code, idx) => {
      const meta = CURRENCY_META[code] || {name: code, flag: '🏳️'};
      const isActive = code === state.activeCode;
      const val = computeValue(code);
      return (
        '<div class="row' + (isActive ? ' active' : '') + '" data-code="' + code + '">' +
          '<div class="reorder">' +
            '<button class="up" ' + (idx===0?'disabled':'') + '>▲</button>' +
            '<button class="down" ' + (idx===state.currencies.length-1?'disabled':'') + '>▼</button>' +
          '</div>' +
          '<div class="flag-plate">' + meta.flag + '</div>' +
          '<div class="row-main">' +
            '<div class="row-top">' +
              '<span class="code">' + code + '</span>' +
              '<span class="name">' + meta.name + '</span>' +
              '<button class="remove" ' + (state.currencies.length<=1?'disabled':'') + '>✕</button>' +
            '</div>' +
            '<input class="value-input" data-code="' + code + '" inputmode="decimal" value="' + val + '">' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  function updateOthers(){
    const inputs = rowsEl.querySelectorAll('.value-input');
    inputs.forEach(inp => {
      const code = inp.dataset.code;
      if(code === state.activeCode) return;
      const formatted = computeValue(code);
      if(inp.value !== formatted){
        inp.value = formatted;
        const row = inp.closest('.row');
        row.classList.remove('flip'); void row.offsetWidth; row.classList.add('flip');
      }
    });
  }

  function setActive(code){
    if(state.activeCode === code) return;
    state.activeCode = code;
    state.rawValue = '1';
    rowsEl.querySelectorAll('.row').forEach(r => r.classList.toggle('active', r.dataset.code === code));
    rowsEl.querySelectorAll('.value-input').forEach(inp => {
      if(inp.dataset.code === code){ inp.value = '1'; }
    });
    updateOthers();
  }

  function handleInput(el){
    let raw = el.value.replace(/[^0-9.]/g, '');
    const parts = raw.split('.');
    if(parts.length > 2) raw = parts[0] + '.' + parts.slice(1).join('');
    el.value = raw;
    state.activeCode = el.dataset.code;
    state.rawValue = raw;
    updateOthers();
  }

  function moveCurrency(code, dir){
    const i = state.currencies.indexOf(code);
    const j = i + dir;
    if(j < 0 || j >= state.currencies.length) return;
    [state.currencies[i], state.currencies[j]] = [state.currencies[j], state.currencies[i]];
    saveState();
    renderRows();
  }

  function removeCurrency(code){
    if(state.currencies.length <= 1) return;
    state.currencies = state.currencies.filter(c => c !== code);
    if(state.activeCode === code){
      state.activeCode = state.currencies[0];
      state.rawValue = '1';
    }
    saveState();
    renderRows();
  }

  function addCurrency(code){
    if(state.currencies.includes(code)) return;
    state.currencies.push(code);
    renderRows();
    fetchRates(state.currencies).then(() => { renderRows(); });
  }

  function renderSearchResults(query){
    const q = query.trim().toLowerCase();
    const entries = Object.keys(CURRENCY_META)
      .filter(code => !state.currencies.includes(code))
      .filter(code => {
        if(!q) return true;
        const meta = CURRENCY_META[code];
        return code.toLowerCase().includes(q) || meta.name.toLowerCase().includes(q);
      });
    if(entries.length === 0){
      searchResults.innerHTML = '<div class="no-results">The Guru hath no such currency. Try again, mortal.</div>';
      return;
    }
    searchResults.innerHTML = entries.map(code => {
      const meta = CURRENCY_META[code];
      return (
        '<div class="result-item" data-code="' + code + '">' +
          '<span class="result-flag">' + meta.flag + '</span>' +
          '<span class="result-code">' + code + '</span>' +
          '<span class="result-name">' + meta.name + '</span>' +
        '</div>'
      );
    }).join('');
  }

  // Event delegation
  rowsEl.addEventListener('input', e => {
    if(e.target.classList.contains('value-input')) handleInput(e.target);
  });
  rowsEl.addEventListener('focusin', e => {
    if(e.target.classList.contains('value-input')){
      setActive(e.target.dataset.code);
      e.target.select();
    }
  });
  rowsEl.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    const row = e.target.closest('.row');
    const code = row && row.dataset.code;
    if(!code) return;
    if(btn.classList.contains('up')) moveCurrency(code, -1);
    else if(btn.classList.contains('down')) moveCurrency(code, 1);
    else if(btn.classList.contains('remove')) removeCurrency(code);
  });

  document.getElementById('refreshBtn').addEventListener('click', () => {
    statusText.textContent = 'UPDATING';
    fetchRates(state.currencies).then(() => updateOthers());
  });

  document.getElementById('addBtn').addEventListener('click', () => {
    addModal.classList.remove('hidden');
    searchInput.value = '';
    renderSearchResults('');
    setTimeout(() => searchInput.focus(), 50);
  });
  document.getElementById('closeModal').addEventListener('click', () => addModal.classList.add('hidden'));
  addModal.addEventListener('click', e => { if(e.target === addModal) addModal.classList.add('hidden'); });
  searchInput.addEventListener('input', e => renderSearchResults(e.target.value));
  searchResults.addEventListener('click', e => {
    const item = e.target.closest('.result-item');
    if(!item) return;
    addCurrency(item.dataset.code);
    addModal.classList.add('hidden');
  });

  // Init
  (async function init(){
    showNewWisdom();
    await loadState();
    renderRows();
    updateStatus();
    await fetchRates(state.currencies);
    renderRows();
  })();
})();
</script>
</body>
</html>
